name: MERCY code checks
on:
  push:
    paths:
      - "index.html"
      - "mercy-modes.js"
      - "sw.js"
      - "models/**"
      - "tests/**"
      - "mercy/**"
      - "README.md"
      - ".github/workflows/test-mercy.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser scripts and offline artifact checks
        run: |
          node --check mercy-modes.js
          node --check sw.js
          node --check autonomy.js
          node --check presence.js
          node --test tests/*.test.cjs
      - name: Legacy Python voice logic tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
